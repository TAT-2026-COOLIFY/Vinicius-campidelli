services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      FRONTEND_URL: http://localhost:4200
    volumes:
      - banco-dados:/app/banco-dados.sqlite
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://localhost:3000/api
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  banco-dados:
