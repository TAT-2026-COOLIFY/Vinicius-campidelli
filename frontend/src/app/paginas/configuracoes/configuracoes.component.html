<app-header-page
  titulo="Configurações"
  descricao="Dados da oficina e sessão do usuário."
></app-header-page>

<div class="grid gap-4 xl:grid-cols-3">
  <!-- Dados da empresa -->
  <section class="cartao p-5 xl:col-span-2">
    <h2 class="titulo-secao">Dados da oficina</h2>
    <p class="texto-apoio mb-4 mt-0.5">Aparecem nas ordens de serviço e nos comprovantes.</p>

    <form [formGroup]="formularioEmpresa" class="grid gap-4 sm:grid-cols-2">
      <div class="sm:col-span-2">
        <label class="rotulo-campo" for="nomeFantasia">Nome fantasia</label>
        <input
          id="nomeFantasia"
          type="text"
          formControlName="nomeFantasia"
          class="h-10 w-full rounded-lg border border-borda px-3 text-[14px] outline-none transition
                 focus:border-marca-400 focus:ring-2 focus:ring-marca-100"
        />
      </div>

      <div>
        <label class="rotulo-campo" for="cnpj">CNPJ</label>
        <input
          id="cnpj"
          type="text"
          formControlName="cnpj"
          class="h-10 w-full rounded-lg border border-borda px-3 font-mono text-[14px] outline-none
                 transition focus:border-marca-400 focus:ring-2 focus:ring-marca-100"
        />
      </div>

      <div>
        <label class="rotulo-campo" for="telefoneEmpresa">Telefone</label>
        <input
          id="telefoneEmpresa"
          type="tel"
          formControlName="telefone"
          class="h-10 w-full rounded-lg border border-borda px-3 text-[14px] outline-none transition
                 focus:border-marca-400 focus:ring-2 focus:ring-marca-100"
        />
      </div>

      <div class="sm:col-span-2">
        <label class="rotulo-campo" for="enderecoEmpresa">Endereço</label>
        <input
          id="enderecoEmpresa"
          type="text"
          formControlName="endereco"
          class="h-10 w-full rounded-lg border border-borda px-3 text-[14px] outline-none transition
                 focus:border-marca-400 focus:ring-2 focus:ring-marca-100"
        />
      </div>

      <div>
        <label class="rotulo-campo" for="horarioAbertura">Abertura</label>
        <input
          id="horarioAbertura"
          type="time"
          formControlName="horarioAbertura"
          class="h-10 w-full rounded-lg border border-borda px-3 text-[14px] outline-none transition
                 focus:border-marca-400 focus:ring-2 focus:ring-marca-100"
        />
      </div>

      <div>
        <label class="rotulo-campo" for="horarioFechamento">Fechamento</label>
        <input
          id="horarioFechamento"
          type="time"
          formControlName="horarioFechamento"
          class="h-10 w-full rounded-lg border border-borda px-3 text-[14px] outline-none transition
                 focus:border-marca-400 focus:ring-2 focus:ring-marca-100"
        />
      </div>
    </form>

    <h2 class="titulo-secao mt-6">Preferências operacionais</h2>
    <p class="texto-apoio mb-4 mt-0.5">Controlam avisos do dia a dia da oficina.</p>

    <form [formGroup]="formularioPreferencias" class="flex flex-col gap-3">
      <label class="flex items-center justify-between gap-3 rounded-lg border border-borda px-3.5 py-3">
        <span>
          <span class="block text-[13.5px] font-medium text-grafite-900">Aviso de estoque mínimo</span>
          <span class="block text-[12px] text-grafite-500">
            Exibe alerta quando uma peça atinge a quantidade mínima.
          </span>
        </span>
        <p-inputSwitch formControlName="avisoEstoqueMinimo" (click)="$event.preventDefault()"></p-inputSwitch>
      </label>
    </form>

    <div class="mt-5 flex justify-end">
      <button
        type="button"
        class="inline-flex h-9 items-center gap-2 rounded-lg bg-marca-500 px-4 text-[13.5px]
               font-semibold text-white transition hover:bg-marca-600 disabled:opacity-60"
        (click)="salvarEmpresa()"
        [disabled]="salvando() || carregando()"
      >
        @if (salvando()) {
          <i class="fa-solid fa-spin fa-spinner text-[13px]"></i>
        }
        Salvar alterações
      </button>
    </div>
  </section>

  <aside class="flex flex-col gap-4">
    <!-- Sessão -->
    <section class="cartao p-5">
      <h2 class="titulo-secao">Sessão</h2>
      <dl class="mt-3 divide-y divide-borda text-[13.5px]">
        <div class="flex justify-between gap-3 py-2.5">
          <dt class="text-grafite-500">Usuário</dt>
          <dd class="font-medium text-grafite-900">{{ usuario()?.nome }}</dd>
        </div>
        <div class="flex justify-between gap-3 py-2.5">
          <dt class="text-grafite-500">Perfil</dt>
          <dd>{{ usuario()?.cargo }}</dd>
        </div>
      </dl>

      <button
        type="button"
        class="mt-4 h-9 w-full rounded-lg border border-rose-200 text-[13.5px] font-medium text-rose-600
               transition hover:bg-rose-50"
        (click)="sair()"
      >
        Sair da conta
      </button>
    </section>
  </aside>
</div>
