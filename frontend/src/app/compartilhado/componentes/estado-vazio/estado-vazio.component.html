<div class="flex flex-col items-center justify-center gap-2 px-6 py-12 text-center">
  <span class="flex h-12 w-12 items-center justify-center rounded-full bg-neve text-grafite-400">
    <i [class]="icone" class="text-[20px]"></i>
  </span>
  <p class="mt-1 text-[15px] font-semibold text-grafite-900">{{ titulo }}</p>
  @if (mensagem) {
    <p class="max-w-sm text-[13.5px] text-grafite-500">{{ mensagem }}</p>
  }
  <div class="mt-3">
    <ng-content></ng-content>
  </div>
</div>
