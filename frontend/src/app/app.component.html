<p-toast position="top-right"></p-toast>
<p-confirmDialog #dialogoConfirmacao [style]="{ width: '420px' }">
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2 px-1 pb-1 pt-2">
      <button
        type="button"
        class="inline-flex h-9 items-center gap-2 rounded-lg border border-rose-100 bg-rose-50 px-4
               text-[13.5px] font-semibold text-rose-500 transition hover:bg-rose-100"
        (click)="dialogoConfirmacao.reject()"
      >
        <i class="fa-solid fa-xmark text-[13px] text-rose-500"></i>
        Cancelar
      </button>
      <button
        type="button"
        class="inline-flex h-9 items-center gap-2 rounded-lg border border-lime-100 bg-lime-50 px-4
               text-[13.5px] font-semibold text-lime-500 transition hover:bg-lime-100"
        (click)="dialogoConfirmacao.accept()"
      >
        <i class="fa-solid fa-check text-[13px] text-lime-500"></i>
        Confirmar
      </button>
    </div>
  </ng-template>
</p-confirmDialog>
<router-outlet></router-outlet>
